name: Apply v0.2.0 Native Typing Patch

on:
  push:
    branches:
      - codex/v0.2.0-native-intellisense
    paths:
      - scripts/apply-v020-native-typing-patch.mjs
      - .github/workflows/apply-v020-patch.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/v0.2.0-native-intellisense

      - name: Apply exact source patch
        run: node scripts/apply-v020-native-typing-patch.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet -- src/extension.ts; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/extension.ts
          git commit -m "feat: route mapped input through native VS Code typing"
          git push origin HEAD:codex/v0.2.0-native-intellisense
