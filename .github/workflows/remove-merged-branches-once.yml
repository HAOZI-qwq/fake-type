name: Remove merged branches once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged development branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for branch in \
            codex/fix-crlf-progress \
            codex/race-free-typing \
            codex/v0.2.0-native-intellisense
          do
            encoded_branch="${branch//\//%2F}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
            fi
          done
