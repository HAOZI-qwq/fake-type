name: Build VS Code Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, Compile and Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package -o fake-type.vsix

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake-type-build-${{ github.sha }}
          path: |
            out/
            fake-type.vsix
          if-no-files-found: error
          retention-days: 14
